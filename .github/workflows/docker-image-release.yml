name: Publish new-api Release Docker image (Docker Hub)

on:
  push:
    tags:
      - 'release-*'

jobs:
  build_and_push:
    name: Build & push AMD64 Docker image
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version & write VERSION
        run: |
          # Triggered by a release-* tag, e.g. release-v1.0.0 -> version v1.0.0
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#release-}
          BUILD_TIME=$(date -u '+%Y%m%dT%H%MZ')
          echo "TAG=$VERSION" >> $GITHUB_ENV
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
          echo "$VERSION" > VERSION
          echo "Building release version: $VERSION (from tag $TAG), build time: $BUILD_TIME for AMD64"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            web/default/node_modules
            web/classic/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('web/default/bun.lock', 'web/classic/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Build frontend
        working-directory: web/default
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          bun install
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=${{ env.TAG }} bun run build

      - name: Build classic frontend
        working-directory: web/classic
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          bun install
          VITE_REACT_APP_VERSION=${{ env.TAG }} bun run build

      - name: Generate Swagger docs
        run: |
          # Install swag if not cached
          if ! command -v swag &> /dev/null; then
            go install github.com/swaggo/swag/v2/cmd/swag@latest
          fi

          make swag VERSION=${{ env.TAG }} BUILD_TIME=${{ env.BUILD_TIME }}

      - name: Build Go binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
          GOEXPERIMENT: greenteagc
        run: |
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=${{ env.TAG }}'" -o new-api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            skynono/new-api

      - name: Prepare Docker context
        run: |
          mkdir -p /tmp/docker-ctx
          cp new-api /tmp/docker-ctx/
          # Inline minimal runtime Dockerfile (equivalent to dev's Dockerfile.ci)
          {
            echo 'FROM debian:bookworm-slim@sha256:f06537653ac770703bc45b4b113475bd402f451e85223f0f2837acbf89ab020a'
            echo 'RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates tzdata libasan8 wget && rm -rf /var/lib/apt/lists/* && update-ca-certificates'
            echo 'COPY new-api /'
            echo 'EXPOSE 3000'
            echo 'WORKDIR /data'
            echo 'ENTRYPOINT ["/new-api"]'
          } > /tmp/docker-ctx/Dockerfile

      - name: Build & push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: /tmp/docker-ctx
          platforms: linux/amd64
          push: true
          tags: |
            skynono/new-api:${{ env.TAG }}
            skynono/new-api:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-rc') || contains(env.TAG, '-alpha') || contains(env.TAG, '-beta') }}
          body: |
            ## 🐳 Docker 镜像

            已发布到 Docker Hub：[`skynono/new-api`](https://hub.docker.com/r/skynono/new-api/tags)

            ```bash
            docker pull skynono/new-api:${{ env.TAG }}
            ```

            | Image Tag | 说明 |
            | --- | --- |
            | `skynono/new-api:${{ env.TAG }}` | 本次发布版本 |
            | `skynono/new-api:latest` | 最新版本 |

            **Digest:** `${{ steps.build.outputs.digest }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
