name: Publish new-api Release Docker image (Docker Hub)

on:
  push:
    tags:
      - 'release-*'

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_time: ${{ steps.v.outputs.build_time }}
    steps:
      - name: Resolve version
        id: v
        run: |
          # Triggered by a release-* tag, e.g. release-v1.0.0 -> version v1.0.0
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#release-}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u '+%Y%m%dT%H%MZ')" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (from tag $TAG)"

  build:
    needs: meta
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/_build-and-push.yml
    with:
      image_name: skynono/new-api
      version: ${{ needs.meta.outputs.version }}
      build_time: ${{ needs.meta.outputs.build_time }}
      create_release: true
    secrets: inherit
