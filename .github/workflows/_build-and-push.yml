name: Build and push Docker image (reusable)

# 公共构建流水线:前端(default + classic)+ swag + Go 二进制 + 推送 Docker 镜像。
# 由 docker-image-release.yml(new-api)和 docker-image-clinx.yml(clinx)通过 workflow_call 复用。
# 触发器和版本解析留在各自的调用方,差异通过 inputs 传入。

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Docker image name, e.g. skynono/new-api'
        required: true
        type: string
      version:
        description: 'Resolved version/tag, used for VERSION, build args and image tag'
        required: true
        type: string
      build_time:
        description: 'Build time stamp for swag'
        required: true
        type: string
      extra_tags:
        description: 'Additional image tags (newline-separated), beyond :version and :latest'
        required: false
        type: string
        default: ''
      create_release:
        description: 'Whether to create a GitHub Release after pushing'
        required: false
        type: boolean
        default: false

env:
  # bun 版本单一来源:改这里同时作用于 setup-bun 与缓存 key(版本变更自动作废旧 bun 缓存)
  BUN_VERSION: '1.3.14'

jobs:
  build_and_push:
    name: Build & push AMD64 Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write VERSION
        run: |
          echo "${{ inputs.version }}" > VERSION
          echo "Building ${{ inputs.image_name }} version ${{ inputs.version }} (build time ${{ inputs.build_time }}) for AMD64"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            web/node_modules
            web/default/node_modules
            web/classic/node_modules
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-

      - name: Install frontend deps
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: web/default
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=${{ inputs.version }} bun run build

      - name: Build classic frontend
        working-directory: web/classic
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: VITE_REACT_APP_VERSION=${{ inputs.version }} bun run build

      - name: Generate Swagger docs
        run: |
          # Install swag if not cached
          if ! command -v swag &> /dev/null; then
            go install github.com/swaggo/swag/v2/cmd/swag@latest
          fi

          make swag VERSION=${{ inputs.version }} BUILD_TIME=${{ inputs.build_time }}

      - name: Build Go binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
          GOEXPERIMENT: greenteagc
        run: |
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=${{ inputs.version }}'" -o new-api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ inputs.image_name }}

      - name: Prepare Docker context
        run: |
          mkdir -p /tmp/docker-ctx
          cp new-api /tmp/docker-ctx/
          # Inline minimal runtime Dockerfile (self-contained, equivalent to dev's Dockerfile.ci)
          {
            echo 'FROM debian:bookworm-slim@sha256:f06537653ac770703bc45b4b113475bd402f451e85223f0f2837acbf89ab020a'
            echo 'RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates tzdata libasan8 wget && rm -rf /var/lib/apt/lists/* && update-ca-certificates'
            echo 'COPY new-api /'
            echo 'EXPOSE 3000'
            echo 'WORKDIR /data'
            echo 'ENTRYPOINT ["/new-api"]'
          } > /tmp/docker-ctx/Dockerfile

      - name: Build & push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: /tmp/docker-ctx
          platforms: linux/amd64
          push: true
          tags: |
            ${{ inputs.image_name }}:${{ inputs.version }}
            ${{ inputs.image_name }}:latest
            ${{ inputs.extra_tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ inputs.version }}
          prerelease: ${{ contains(inputs.version, '-rc') || contains(inputs.version, '-alpha') || contains(inputs.version, '-beta') }}
          body: |
            ## 🐳 Docker 镜像

            已发布到 Docker Hub：[`${{ inputs.image_name }}`](https://hub.docker.com/r/${{ inputs.image_name }}/tags)

            ```bash
            docker pull ${{ inputs.image_name }}:${{ inputs.version }}
            ```

            | Image Tag | 说明 |
            | --- | --- |
            | `${{ inputs.image_name }}:${{ inputs.version }}` | 本次发布版本 |
            | `${{ inputs.image_name }}:latest` | 最新版本 |

            **Digest:** `${{ steps.build.outputs.digest }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
